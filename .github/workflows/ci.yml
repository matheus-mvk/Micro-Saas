name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend API
    runs-on: ubuntu-latest
    steps:
      # The repository is a pnpm monorepo; dependencies must be installed at the root
      # so workspace packages such as @logistics/shared resolve correctly.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @logistics/api db:generate

      - name: Build shared contracts
        run: pnpm --filter @logistics/shared build

      - name: Run backend tests
        run: pnpm --filter @logistics/api test

  frontend:
    name: Frontend Web
    runs-on: ubuntu-latest
    steps:
      # The frontend is deployed independently, but CI still installs from the root
      # because it imports local workspace contracts from packages/shared.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @logistics/shared build

      - name: Run frontend linter
        run: pnpm --filter @logistics/web lint

      - name: Run frontend tests
        run: pnpm --filter @logistics/web test
