services:
  mysql:
    image: mysql:8.4
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=16M
      - --max-connections=40
      - --table-open-cache=400
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-logistics_saas}
      MYSQL_USER: ${MYSQL_USER:-logistics}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-logistics_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    mem_limit: ${MYSQL_MEM_LIMIT:-512m}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - logistics

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - logistics

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://logistics:logistics_password@mysql:3306/logistics_saas}
      NODE_OPTIONS: ${API_NODE_OPTIONS:---max-old-space-size=256}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command:
      - sh
      - -c
      - pnpm --filter @logistics/api db:deploy && if [ "$${NODE_ENV}" != "production" ] || [ "$${ALLOW_DEMO_SEED}" = "true" ]; then pnpm --filter @logistics/api db:seed; fi && node apps/api/dist/src/main.js
    mem_limit: ${API_MEM_LIMIT:-512m}
    ports:
      - "${API_PORT:-3333}:3333"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/api/v1/health/live >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - logistics

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333/api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    environment:
      NODE_OPTIONS: ${WEB_NODE_OPTIONS:---max-old-space-size=192}
      WEB_PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    mem_limit: ${WEB_MEM_LIMIT:-384m}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - logistics

  adminer:
    image: adminer:4
    profiles: ["devtools"]
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - logistics

volumes:
  mysql-data:
  redis-data:

networks:
  logistics:
    driver: bridge
